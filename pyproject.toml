# Tool configuration only; the app is run from a checkout (see README).

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# Long SQL strings and messages are left to the formatter's judgement.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["db", "gui", "logic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "mysql: needs a disposable MySQL server (set ISCORE_RUN_DB_TESTS=1)",
    "gui: needs Tk and a display",
]
