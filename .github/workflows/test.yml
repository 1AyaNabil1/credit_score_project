name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    services:
      # Disposable MySQL for tests/test_mysql_integration.py. It exists only
      # for the length of the job, so it runs without a root password.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ISCORE_DB_HOST: 127.0.0.1
      ISCORE_DB_PORT: "3306"
      ISCORE_DB_USER: root
      ISCORE_DB_PASSWORD: ""
      ISCORE_RUN_DB_TESTS: "1"
      ISCORE_REQUIRE_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display for the GUI smoke test
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Run tests
        run: xvfb-run -a python -m pytest
